<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, accessible task manager application">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <header class="app-header">
            <h1>Task Manager</h1>
            <p class="subtitle">Stay organized and productive</p>
            <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span class="toggle-icon">🌙</span>
            </button>
        </header>

        <section class="input-section" aria-labelledby="add-task-heading">
            <h2 id="add-task-heading" class="sr-only">Add New Task</h2>
            <form class="task-form" id="taskForm">
                <div class="input-group">
                    <label for="taskInput" class="sr-only">Enter a new task</label>
                    <input type="text" id="taskInput" class="task-input" placeholder="Add a new task..."
                        autocomplete="off" aria-label="Enter a new task" required>
                    <button type="submit" class="add-button" aria-label="Add new task">
                        <span>Add Task</span>
                    </button>
                </div>
                <div id="taskError" class="error-message" role="alert" aria-live="polite"></div>
            </form>
        </section>

        <section class="filter-section" aria-labelledby="filter-heading">
            <h2 id="filter-heading" class="sr-only">Filter Tasks</h2>
            <div class="filter-buttons">
                <button class="filter-button active" data-filter="all" aria-pressed="true" aria-label="Show all tasks">
                    All
                </button>
                <button class="filter-button" data-filter="active" aria-pressed="false" aria-label="Show active tasks">
                    Active
                </button>
                <button class="filter-button" data-filter="completed" aria-pressed="false"
                    aria-label="Show completed tasks">
                    Completed
                </button>
            </div>
        </section>

        <section class="tasks-section" aria-labelledby="tasks-heading">
            <h2 id="tasks-heading" class="sr-only">Tasks List</h2>
            <div id="taskStats" class="task-stats" role="status" aria-live="polite">
                <span id="activeCount">0</span> active ·
                <span id="completedCount">0</span> completed
            </div>

            <div id="tasksContainer" class="tasks-container">
                <div class="empty-state">
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>
        </section>

        <footer class="app-footer">
            <button id="clearCompleted" class="clear-button" aria-label="Clear all completed tasks">
                Clear Completed Tasks
            </button>
        </footer>
    </main>

    <template id="taskTemplate">
        <article class="task-item" role="listitem">
            <div class="task-checkbox">
                <input type="checkbox" class="task-checkbox-input" aria-label="Mark task as complete">
            </div>
            <div class="task-content">
                <p class="task-text"></p>
            </div>
            <button class="delete-button" aria-label="Delete task" type="button">
                <span class="sr-only">Delete</span>
                <span aria-hidden="true">×</span>
            </button>
        </article>
    </template>

    <script src="script.js"></script>
</body>

</html>
