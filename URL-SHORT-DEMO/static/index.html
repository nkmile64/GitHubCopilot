<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>URL Shortener</h1>

    <section>
      <h2>Shorten</h2>
      <form id="shorten-form">
        <input id="long-url" type="url" placeholder="https://example.com/long/url" required>
        <button type="submit">Shorten</button>
      </form>
      <p id="shorten-output" class="output"></p>
    </section>

    <section>
      <h2>Look up</h2>
      <form id="lookup-form">
        <input id="short-url" type="text" placeholder="Short URL or code" required>
        <button type="submit">Look up</button>
      </form>
      <p id="lookup-output" class="output"></p>
    </section>
    
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
